# Construye el instalador de Windows en un runner limpio, no en la máquina de
# nadie. Nació de un susto real: el `release/Latte-Setup.exe` que había en el
# disco era de dos días antes y le faltaban cuatro cambios ya mergeados. Un
# build que sale de un clon limpio del tag no puede tener esa clase de sorpresa.
#
# Además es el requisito de entrada para firmar gratis con SignPath Foundation:
# ellos firman artefactos que salen de un CI público, no de un disco.
name: Release Windows

on:
  push:
    tags: ['v*']
  # Sin tag: compila y deja el instalador como artefacto para descargar y
  # probar. No crea ninguna release.
  workflow_dispatch:

defaults:
  run:
    shell: bash

jobs:
  build:
    runs-on: windows-latest
    permissions:
      # Solo para crear la release en borrador cuando el disparo es un tag.
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      # El tag y package.json tienen que decir lo mismo: `latest.yml` lleva la
      # versión de package.json y el actualizador compara contra ella. Si no
      # coinciden, la release miente sobre lo que contiene.
      - name: La versión del tag coincide con package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          tag="${GITHUB_REF_NAME#v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::El tag dice $tag y package.json dice $pkg. Subí la versión o corregí el tag."
            exit 1
          fi
          echo "Versión $pkg"

      - name: Typecheck
        run: npm run typecheck:all

      - name: Tests
        run: npm test

      - name: Empaquetar
        run: npm run pack:win

      # electron-builder puede terminar sin error y aun así dejar algo que no
      # sirve: acá se mira lo que quedó, no lo que el log dice que hizo.
      - name: Los artefactos existen y dicen la versión correcta
        run: |
          pkg="$(node -p "require('./package.json').version")"
          test -f release/Latte-Setup.exe || { echo "::error::No se generó release/Latte-Setup.exe"; exit 1; }
          test -f release/latest.yml || { echo "::error::No se generó release/latest.yml"; exit 1; }
          grep -q "^version: ${pkg}$" release/latest.yml || { echo "::error::latest.yml no declara la versión ${pkg}"; exit 1; }
          echo "Instalador: $(wc -c < release/Latte-Setup.exe) bytes"
          cat release/latest.yml

      - uses: actions/upload-artifact@v4
        with:
          name: latte-windows-installer
          path: |
            release/Latte-Setup.exe
            release/latest.yml
            release/*.exe.blockmap
          retention-days: 14

      # Borrador, nunca publicada: nada llega a nadie hasta que una persona
      # escribe las notas y aprieta publicar en GitHub. Es la misma regla de
      # docs/RELEASING.md, puesta donde no se puede olvidar.
      - name: Release en borrador
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="$GITHUB_REF_NAME"
          if ! gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if ! gh release create "$tag" \
              --repo "$GITHUB_REPOSITORY" \
              --draft \
              --title "Latte ${tag#v}" \
              --notes "Borrador generado por CI desde \`$GITHUB_SHA\`.

          Escribí las notas reales antes de publicar: qué cambió, qué necesita quien lo instala, y la advertencia de SmartScreen mientras el instalador siga sin firmar.

          **La release tiene que ser normal, no prerelease**: \`/releases/latest/download/\` ignora las prereleases y dejaría el botón de la landing apuntando a la versión anterior."
            then
              echo "::warning::No se pudo crear la release; puede haberla creado otro workflow."
            fi
          fi
          for attempt in {1..10}; do
            if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 10 ]; then
              echo "::error::La release $tag no apareció después de 10 intentos."
              exit 1
            fi
            sleep 2
          done
          gh release upload "$tag" release/Latte-Setup.exe release/latest.yml --repo "$GITHUB_REPOSITORY" --clobber
