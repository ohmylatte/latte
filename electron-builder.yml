# Packaging configuration for Latte on Windows, macOS, and Linux.
#
# Windows and Linux package builds are exercised by platform workflows and
# documented local evidence; publishing stays draft and human-reviewed.
# macOS config exists, but support is neither promised nor verified.
appId: app.ohmylatte.latte
productName: Latte
directories:
  output: release

# Development keeps `main: electron/main.cjs` (TypeScript through tsx). Only the
# packaged application points at the compiled bundle.
extraMetadata:
  main: dist-electron/main.cjs

files:
  - dist/**
  - dist-electron/**
  - packs/**
  - assets/icon-*.png
  - package.json
# Production dependencies are collected by electron-builder itself; development
# dependencies (tsx, vite, electron-builder) never travel.

# node-pty is the only native dependency and it ships N-API prebuilds, which
# load in Node and in Electron without an ABI-specific rebuild: its own loader
# falls back to prebuilds/<platform>-<arch>/ when build/Release is absent.
# Rebuilding it from source fails anyway — the winpty submodule inside the npm
# tarball has no git metadata, so node-gyp cannot run GetCommitHash.bat.
# sql.js is WebAssembly and never needed a rebuild either.
npmRebuild: false

asar: true
asarUnpack:
  # Native addon: a .node file cannot be loaded from inside an archive.
  - '**/node_modules/node-pty/**'
  # Ships sql-wasm.wasm next to its JavaScript; unpacking removes any doubt
  # about how the WebAssembly file is located at runtime.
  - '**/node_modules/sql.js/**'

publish:
  provider: github
  owner: ohmylatte
  repo: latte
  # Draft on purpose: the release is written, then a human looks at it and
  # publishes. Nothing reaches users by running a build.
  releaseType: draft

# Direct distribution outside the Mac App Store. ZIP is not optional here:
# electron-updater/Squirrel.Mac needs it to generate and consume latest-mac.yml.
# Building both architectures in one electron-builder invocation also produces
# one coherent metadata file containing both ZIPs.
mac:
  category: public.app-category.business
  icon: assets/icon-512.png
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  notarize: true
  electronUpdaterCompatibility: '>= 2.16'
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  artifactName: '${productName}-${version}-mac-${arch}.${ext}'

dmg:
  artifactName: '${productName}-${version}-mac-${arch}.${ext}'

win:
  target:
    - target: nsis
      arch:
        - x64
  # electron-builder converts this PNG to the .ico the installer needs.
  icon: assets/icon-512.png
  artifactName: Latte-Setup.exe

nsis:
  # The public download is one file with one name, so the landing can link
  # straight to it: /releases/latest/download/Latte-Setup.exe
  artifactName: Latte-Setup.exe
  # The welcome page of an assisted installer shows a 164x314 image. Without
  # one, NSIS draws its own grey default at the first moment anybody sees the
  # product. Regenerate with `npm run assets:installer`; the icon of the
  # installer itself is inherited from `win.icon` above.
  installerSidebar: build/installerSidebar.bmp
  uninstallerSidebar: build/uninstallerSidebar.bmp
  oneClick: false
  perMachine: false
  allowElevation: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Latte
  # Brands, works, documents and versions live in userData and are not the
  # installer's to remove. Uninstalling Latte must not erase the user's work.
  deleteAppDataOnUninstall: false
  # Differential downloads are an optimisation, and they interact with the
  # fixed artifact name above. Off until a real update between two published
  # versions has been observed working.
  differentialPackage: false

linux:
  icon: assets/icon-512.png
  category: Utility
  # Paquete y metadata Debian. Sin `maintainer` el .deb se construye igual
  # pero advierte; este es el contacto público del proyecto.
  maintainer: "Oh My Latte <hola@ohmylatte.app>"
  # Solo x64 verificado (ver decisiones §8). Añadir arm64 cuando haya runner.
  target:
    - target: AppImage
      arch: [x64]
    - target: deb
      arch: [x64]
  artifactName: '${productName}-${version}-linux-${arch}.${ext}'
  # .desktop: nombre y descripción que se ven en el menú de aplicaciones.
  desktop:
    entry:
      Name: Latte
      Comment: Dirigí agentes de IA alrededor de tus marcas y entregables
      Categories: Utility;Office;
      StartupWMClass: latte
