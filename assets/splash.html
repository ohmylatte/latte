<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'unsafe-inline'; font-src 'self'" />
  <title>Latte</title>
  <style>
    @font-face { font-family: 'Latte Serif'; src: url('../src/fonts/instrument-serif-italic.ttf'); }
    html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #f6f3ed; user-select: none; }
    /* The frameless window can still be dragged by its paper. */
    body { -webkit-app-region: drag; }
    canvas { display: block; width: 100%; height: 100%; }
  </style>
</head>
<body>
  <canvas id="splash" width="960" height="600"></canvas>
  <script src="brand/print-kit.js"></script>
  <script src="splash.js"></script>
</body>
</html>
